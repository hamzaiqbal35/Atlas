version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js
  - React
  - Tailwind CSS
  - Three.js
  - Framer Motion
  - Zustand
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Main landing page with 3D solar system visualization, scroll manager, and interactive celestial bodies.
  - path: /explore
    file: src/app/explore/page.tsx
    auth_required: false
    description: Explore page to view different space categories.
  - path: /events
    file: src/app/events/page.tsx
    auth_required: false
    description: Space events and news page.
  - path: /galaxies
    file: src/app/galaxies/page.tsx
    auth_required: false
    description: Galaxies overview page.
  - path: /body/[id]
    file: src/app/body/[id]/page.tsx
    auth_required: false
    description: Detailed information about a specific celestial body.
features:
  - name: Solar System Exploration
    description: Scroll through the 3D solar system with informational panels and mini-map.
    files:
      - src/app/page.tsx
      - src/components/ScrollManager.tsx
      - src/components/ui/InfoPanel.tsx
    entry_route: /
    user_interactions:
      - Scroll to navigate between planets
      - Hover over planets to see tooltips and info panels
      - Click on mini-map to jump to sections
    api_calls: []
    auth_required: false
known_limitations: []
